# 阶段 0：把训练管线跑通，并建立"地板线"
# 用法: .\run.ps1 -m tlab prepare -c experiments/stage0_bigram.yaml
#       .\run.ps1 -m tlab train   -c experiments/stage0_bigram.yaml

seed: 42
run:
  name: stage0_bigram

data:
  block_size: 128
  val_frac: 0.1

model:
  name: bigram
  d_model: 64

train:
  device: cuda
  amp: bf16
  batch_size: 32
  grad_accum: 1
  max_steps: 2000
  lr: 3.0e-3
  min_lr_ratio: 0.1
  warmup_steps: 100
  weight_decay: 0.01
  grad_clip: 1.0
  log_every: 50
  eval_every: 200
  eval_batches: 20
  ckpt_every: 1000
